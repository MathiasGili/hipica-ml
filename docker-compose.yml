# ============================================================================
# Hipica-ML — AWS Elastic Beanstalk deployment
# ----------------------------------------------------------------------------
# This is the compose file that EBS reads on the EC2 instance.
# Only two services are shipped online:
#   api        : FastAPI inference server (internal, no public port)
#   streamlit  : Streamlit UI (public, mapped to host port 80)
#
# MLflow, Postgres and the scheduler are intentionally NOT deployed:
#   * the API falls back to the local joblib model bundled in the image
#   * postgres/mlflow are only needed for training / experiment tracking
#   * the scheduler is just a cache warmer — the API scrapes on demand
#
# For local development (with the full stack incl. postgres/mlflow) use:
#   docker compose -f docker-compose.local.yml up -d
# ============================================================================

version: "3.8"

services:
  # --------------------------------------------------------------------------
  # FastAPI inference service (internal only)
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: hipica-ml/api:latest
    restart: unless-stopped
    environment:
      # No MLFLOW_TRACKING_URI → model_loader falls back to the local joblib
      # under /app/models/trifecta_pipeline/.
      MODEL_NAME: local
      PYTHONUNBUFFERED: "1"
    volumes:
      # The EBS deploy bundle is unpacked into /var/app/current on the host,
      # so these relative paths resolve to the files we shipped in the zip.
      - ./models:/app/models:ro
      - ./data:/app/data
    ports:
      # Public port for the FastAPI /docs (Swagger) UI.
      # Security group ingress on 8080 is opened in .ebextensions/01-open-api-port.config
      - "8080:8000"
    command: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks: [hipica_net]

  # --------------------------------------------------------------------------
  # Streamlit UI (public entrypoint on port 80)
  # --------------------------------------------------------------------------
  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit.Dockerfile
    image: hipica-ml/streamlit:latest
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Streamlit reaches the API over the internal compose network.
      API_URL: http://api:8000
    ports:
      # EBS routes the environment's public URL to whatever is bound on port 80.
      - "80:8501"
    volumes:
      - ./app:/app/app:ro
    command: >
      streamlit run app/streamlit_app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
    networks: [hipica_net]

networks:
  hipica_net:
    driver: bridge
